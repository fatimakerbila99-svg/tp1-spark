services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tp2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tp2admin
      MINIO_ROOT_PASSWORD: Tp2Minio2026!
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    networks: [hadoop]

  mysql:
    image: mysql:8.0.40
    container_name: tp2-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Tp2Root2026!
      MYSQL_DATABASE: retail
      MYSQL_USER: tp2
      MYSQL_PASSWORD: Tp2Mysql2026!
    command:
      - "--innodb-buffer-pool-size=64M"
      - "--max-connections=20"
      - "--performance-schema=OFF"
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [hadoop]

networks:
  hadoop:
    external: true

volumes:
  minio-data:
  mysql-data: